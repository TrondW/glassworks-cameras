<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassWorks Cameras — Interactive 3D Studio Viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #181a1e;
    --panel: rgba(20, 22, 26, 0.84);
    --border: rgba(255, 255, 255, 0.12);
    --text: #eef0f4;
    --muted: #9aa0aa;
    --accent: #e0a94c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #stage { width: 100%; height: 100%; display: block; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 280px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .brand { display: flex; justify-content: space-between; align-items: baseline; }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .brand span { font-size: 11px; color: var(--muted); }
  .row { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  select, button {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  select option { background: #1d2026; color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.11); }
  button.active { border-color: var(--accent); color: var(--accent); background: rgba(224, 169, 76, 0.14); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .meta { font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
  .meta strong { color: var(--text); font-weight: 500; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<aside class="hud" aria-label="Camera Controls">
  <div class="brand">
    <h1>GlassWorks</h1>
    <span>8 cameras · 53 lenses</span>
  </div>
  <div class="row">
    <label for="camSel">Camera</label>
    <select id="camSel"></select>
  </div>
  <div class="row">
    <label for="lensSel">Lens</label>
    <select id="lensSel"></select>
  </div>
  <div class="grid">
    <button id="btnFinder" type="button">Finder / Hood</button>
    <button id="btnHood" type="button">Lens Shade</button>
    <button id="btnDoor" type="button">Open Back</button>
    <button id="btnFilm" type="button">Load Film</button>
    <button id="btnCutaway" type="button">Cutaway</button>
    <button id="btnExplode" type="button">Explode</button>
  </div>
  <button id="btnFire" type="button">Fire Shutter</button>
  <div id="meta" class="meta">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
</aside>
<script type="module" src="./viewer.js"></script>
</body>
</html>
